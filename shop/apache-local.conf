ServerName localhost

<VirtualHost *:80>
    ServerName localhost
    Redirect permanent / https://${PS_DOMAIN}/
</VirtualHost>

<VirtualHost *:443>
    ServerName https://${PS_DOMAIN}
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile /etc/apache2/local-tls/localhost.crt
    SSLCertificateKeyFile /etc/apache2/local-tls/localhost.key

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
